services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/app.db
      DATA_DIR: ./data
      MASTER_KEY: ${MASTER_KEY:-dev-master-key-do-not-use-in-prod}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
